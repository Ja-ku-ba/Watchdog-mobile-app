name: watchdog
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_dotenv: ^6.0.0
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.5.3
  http: ^1.5.0
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.6
  network_info_plus: ^7.0.0
  wifi_scan: ^0.4.1+2
  permission_handler: ^12.0.1
  android_intent_plus: ^6.0.0
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  image_picker: ^1.2.1
  image_cropper: ^11.0.0
  flutter_svg: ^2.2.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo_berek_czarne.svg
    - assets/images/logo_berek_biale.svg

flutter_native_splash:
  color: "#1a1a1a"
  image: assets/images/logo_berek_biale_obrys_duze.png
  android: true
  ios: false
  fullscreen: true
  android_gravity: center
  android_12:
    color: "#1a1a1a"
    image: assets/images/logo_berek_biale_obrys_duze.png
    icon_background_color: "#1a1a1a"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_berek_czarne.png"
  adaptive_icon_background: "#1a1a1a"
  adaptive_icon_foreground: "assets/images/logo_berek_czarne.png"
